name: Uninstaller safety
on:
  push:
    paths:
      - 'boss_apply/uninstall.py'
      - 'tests/*uninstall*'
      - 'uninstall.*'
      - '.github/workflows/uninstall.yml'
  pull_request:
    paths:
      - 'boss_apply/uninstall.py'
      - 'tests/*uninstall*'
      - 'uninstall.*'
      - '.github/workflows/uninstall.yml'
jobs:
  disposable-installation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tests/integration_uninstall.py
